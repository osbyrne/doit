name: Publish native preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: flox/install-flox-action@v2
        with:
          version: "1.17.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install app dependencies
        working-directory: apps/DoitMac
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun install --frozen-lockfile

      - name: Build and verify APK
        working-directory: apps/DoitMac/android
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flox activate -d "$GITHUB_WORKSPACE" -- bash -euo pipefail -c '
            ./gradlew --no-daemon assembleRelease
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            test -f "$APK_PATH"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK_PATH"
            cp "$APK_PATH" "$RUNNER_TEMP/Doit-Android-${RELEASE_TAG}.apk"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/Doit-Android-${{ github.ref_name }}.apk
          if-no-files-found: error

  macos:
    name: Build macOS app bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: flox/install-flox-action@v2
        with:
          version: "1.17.0"

      - name: Install CocoaPods if needed
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

      - name: Install app dependencies
        working-directory: apps/DoitMac
        run: flox activate -d "$GITHUB_WORKSPACE" -- bun install --frozen-lockfile

      - name: Install macOS native dependencies
        working-directory: apps/DoitMac
        run: flox activate -d "$GITHUB_WORKSPACE" -- pod install --project-directory=macos

      - name: Build unsigned macOS app and Control Center extension
        working-directory: apps/DoitMac
        env:
          DERIVED_DATA: ${{ runner.temp }}/doit-derived
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flox activate -d "$GITHUB_WORKSPACE" -- bash -euo pipefail -c '
            xcodebuild \
              -workspace macos/com.osbyrne.doit.xcworkspace \
              -scheme com.osbyrne.doit-macOS \
              -configuration Release \
              -sdk macosx \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build

            APP_PATH="$(find "$DERIVED_DATA/Build/Products/Release" -maxdepth 1 -type d -name "*.app" -print -quit)"
            test -n "$APP_PATH"
            test -d "$APP_PATH/Contents/PlugIns/DoitControl.appex"
            ditto -c -k --sequesterRsrc --keepParent \
              "$APP_PATH" \
              "$RUNNER_TEMP/Doit-macOS-${RELEASE_TAG}.zip"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ runner.temp }}/Doit-macOS-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - android
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: release-assets

      - name: Publish prerelease and platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## Native preview downloads

          - **Android:** install the APK on Android 7.0 or later. It is signed with the repository's development/debug key and is for preview use; this is not a Play Store or production signing setup.
          - **macOS:** unzip the app and move it to Applications. It is not signed with a Developer ID certificate or notarized, so Gatekeeper may block the first launch. The included Control Center control requires macOS 26 or later; its authenticated actions still need the shared-session bridge described in the README.

          This is an early preview release. The web app remains available at https://doit.osbyrne.workers.dev.
          NOTES

          gh release create "$RELEASE_TAG" \
            "release-assets/Doit-Android-${RELEASE_TAG}.apk" \
            "release-assets/Doit-macOS-${RELEASE_TAG}.zip" \
            --title "Doit ${RELEASE_TAG} native preview" \
            --notes-file release-notes.md \
            --prerelease
